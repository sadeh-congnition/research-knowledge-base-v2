{% if results %}
{% for res in results %}
<div style="padding: 1rem; border-bottom: 1px solid var(--border-color);">
    <a style="display: block; font-weight: bold; margin-bottom: 0.5rem;"
        href="{% if res.type == 'node' %}/node/{{ res.node_id }}/{% else %}/question/{{ res.question_id }}/{% endif %}">
        {{ res.title }}
    </a>
    <div style="font-size: 0.85rem; color: var(--text-muted);">
        {{ res.snippet }}
    </div>
</div>
{% endfor %}
<div style="padding: 0.5rem; text-align: center;">
    <a href="/search/?q={{ request.GET.q }}">View all</a>
</div>
{% else %}
<div style="padding: 1rem; text-align: center; color: var(--text-muted);">
    No results found.
</div>
{% endif %}
